server:
  port: 8080

spring:
  application:
    name: spring-batch-rest
  main:
    web-application-type: servlet
  batch:
    job:
      enabled: false
    initialize-schema: always
    jdbc:
      initialize-schema: always
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:h2:mem:batchdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

